# Self-hosted call server (WebRTC SFU) for Clean2Go app-to-app calls.
# Replaces Agora (foreign service). Backend signs access tokens with the
# same key/secret, entered in admin: Настройки → Сторонние сервисы → Звонки.
#
#   cp .env.example .env   # set LIVEKIT_KEYS="<key>: <secret>", LIVEKIT_NODE_IP
#   docker compose up -d
#
# Ports: 7880 HTTP/WebSocket (apps connect here), 7881 TCP and
# 50000-50100 UDP for media. In production put 7880 behind TLS (wss://)
# and open the UDP range in the firewall.
services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: clean2go-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml --node-ip ${LIVEKIT_NODE_IP}
    environment:
      LIVEKIT_KEYS: ${LIVEKIT_KEYS}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
