# LiveKit server config. Keys come from LIVEKIT_KEYS in .env (never here).
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
room:
  # Calls are 1:1; a room closes when both have left.
  max_participants: 2
  empty_timeout: 60
logging:
  level: info
