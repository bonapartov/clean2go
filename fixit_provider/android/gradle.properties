org.gradle.jvmargs=-Xmx4096m --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
android.ndk.suppressMinSdkVersionError = 21

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Compile Kotlin inside the Gradle daemon: a separate Kotlin daemon
# pushes a 7.7 GB dev machine out of memory.
kotlin.compiler.execution.strategy=in-process
